<script>
/* ===== 題庫：大家的日本語 第 1–12 課的片假名單字 ===== */

  // 第 2 課

  { k: "シャープペンシル", z: "自動鉛筆", l: 2 },
  { k: "シーディー", z: "CD、光碟", l: 2 },
  { k: "テレビ", z: "電視", l: 2 },
  { k: "ラジオ", z: "收音機", l: 2 },
  { k: "カメラ", z: "照相機", l: 2 },
  { k: "コンピューター", z: "電腦", l: 2 },
  { k: "チョコレート", z: "巧克力", l: 2 },
  { k: "コーヒー", z: "咖啡", l: 2 },
  // 第 3 課
  { k: "ロビー", z: "大廳、休息室", l: 3 },
  { k: "トイレ", z: "廁所", l: 3 },
  { k: "エレベーター", z: "電梯", l: 3 },
  { k: "エスカレーター", z: "電扶梯", l: 3 },
  { k: "ネクタイ", z: "領帶", l: 3 },
  { k: "ワイン", z: "葡萄酒", l: 3 },
  { k: "イタリア", z: "義大利", l: 3 },
  { k: "スイス", z: "瑞士", l: 3 },
  { k: "フランス", z: "法國", l: 3 },

  // 第 4 課

  { k: "ロサンゼルス", z: "洛杉磯", l: 4 },
  { k: "ロンドン", z: "倫敦", l: 4 },
  // 第 5 課
  { k: "スーパー", z: "超市", l: 5 },
  { k: "バス", z: "公車、巴士", l: 5 },
  { k: "タクシー", z: "計程車", l: 5 },
  // 第 6 課
  { k: "パン", z: "麵包", l: 6 },
  { k: "ミルク", z: "牛奶", l: 6 },
  { k: "ジュース", z: "果汁", l: 6 },
  { k: "ビール", z: "啤酒", l: 6 },

  { k: "テニス", z: "網球", l: 6 },
  { k: "サッカー", z: "足球", l: 6 },
  // 第 7 課
  { k: "スプーン", z: "湯匙", l: 7 },
  { k: "ナイフ", z: "刀子", l: 7 },
  { k: "フォーク", z: "叉子", l: 7 },
  { k: "パソコン", z: "個人電腦", l: 7 },
  { k: "ケータイ", z: "手機", l: 7 },
  { k: "メール", z: "電子郵件", l: 7 },
  { k: "パンチ", z: "打洞機", l: 7 },
  { k: "ホッチキス", z: "釘書機", l: 7 },
  { k: "セロテープ", z: "透明膠帶", l: 7 },
  { k: "シャツ", z: "襯衫", l: 7 },
  { k: "プレゼント", z: "禮物", l: 7 },
  { k: "クリスマス", z: "聖誕節", l: 7 },
  // 第 8 課
  { k: "ハンサム", z: "英俊", l: 8 },
  { k: "レストラン", z: "餐廳", l: 8 },
  { k: "シャンハイ", z: "上海", l: 8 },
  // 第 9 課
  { k: "スポーツ", z: "運動", l: 9 },
  { k: "ダンス", z: "舞蹈", l: 9 },
  { k: "クラシック", z: "古典音樂", l: 9 },
  { k: "ジャズ", z: "爵士樂", l: 9 },
  { k: "コンサート", z: "音樂會、演唱會", l: 9 },
  { k: "カラオケ", z: "卡拉 OK", l: 9 },
  { k: "ローマ字", z: "羅馬拼音", l: 9 },
  { k: "チケット", z: "票", l: 9 },
  { k: "アルバイト", z: "打工", l: 9 },
  // 第 10 課
  { k: "パンダ", z: "貓熊", l: 10 },
  { k: "スイッチ", z: "開關", l: 10 },
  { k: "テーブル", z: "餐桌", l: 10 },
  { k: "ベッド", z: "床", l: 10 },
  { k: "ドア", z: "門", l: 10 },
  { k: "ポスト", z: "郵筒", l: 10 },
  { k: "ビル", z: "大樓", l: 10 },
  { k: "エーティーエム", z: "自動提款機（ATM）", l: 10 },
  { k: "コンビニ", z: "便利商店", l: 10 },
  // 第 11 課
  { k: "サンドイッチ", z: "三明治", l: 11 },
  { k: "カレーライス", z: "咖哩飯", l: 11 },
  { k: "アイスクリーム", z: "冰淇淋", l: 11 },
  { k: "クラス", z: "班級", l: 11 },
  // 第 12 課
  { k: "ホテル", z: "飯店", l: 12 },
  { k: "パーティー", z: "派對、宴會", l: 12 },
  { k: "レモン", z: "檸檬", l: 12 }
];

const QUESTIONS_PER_ROUND = 10;

const $ = id => document.getElementById(id);
const shuffle = a => {
  const r = a.slice();
  for (let i = r.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [r[i], r[j]] = [r[j], r[i]];
  }
  return r;
};

let state = { lesson: 0, mode: "k2z", queue: [], index: 0, correct: 0, wrong: [], locked: false };

/* ---------- 開始畫面 ---------- */
const lessons = [...new Set(WORDS.map(w => w.l))].sort((a, b) => a - b);
$("lessonList").innerHTML =
  `<button class="chip on" data-l="0">全部</button>` +
  lessons.map(l => `<button class="chip" data-l="${l}">第 ${l} 課</button>`).join("");

$("lessonList").addEventListener("click", e => {
  const chip = e.target.closest(".chip");
  if (!chip) return;
  document.querySelectorAll(".chip").forEach(c => c.classList.remove("on"));
  chip.classList.add("on");
  state.lesson = Number(chip.dataset.l);
});

document.querySelectorAll('input[name="mode"]').forEach(r =>
  r.addEventListener("change", () => {
    state.mode = r.value;
    document.querySelectorAll(".mode").forEach(m => m.classList.remove("on"));
    r.closest(".mode").classList.add("on");
  })
);

/* ---------- 出題 ---------- */
function pool() {
  return state.lesson === 0 ? WORDS : WORDS.filter(w => w.l === state.lesson);
}

function startRound() {
  const base = pool();
  state.queue = shuffle(base).map(w => ({
    w,
    dir: state.mode === "mix" ? (Math.random() < 0.5 ? "k2z" : "z2k") : state.mode
  }));
  if (state.queue.length > QUESTIONS_PER_ROUND) {
    state.queue = state.queue.slice(0, QUESTIONS_PER_ROUND);
  } else {
    const orig = state.queue.slice();
    while (state.queue.length < QUESTIONS_PER_ROUND) {
      state.queue = state.queue.concat(shuffle(orig));
    }
    state.queue = state.queue.slice(0, QUESTIONS_PER_ROUND);
  }
  state.index = 0;
  state.correct = 0;
  state.wrong = [];
  $("qTotal").textContent = state.queue.length;
  show("quiz");
  renderQuestion();
}

function renderQuestion() {
  state.locked = false;
  const q = state.queue[state.index];
  const askKatakana = q.dir === "k2z";

  $("qNo").textContent = state.index + 1;
  $("okNo").textContent = state.correct;
  $("barFill").style.width = (state.index / state.queue.length * 100) + "%";
  $("prompt").textContent = askKatakana ? "這個片假名是什麼意思？" : "哪一個是這個意思的片假名？";
  $("word").textContent = askKatakana ? q.w.k : q.w.z;
  $("word").style.fontSize = askKatakana ? "clamp(30px, 6vw, 54px)" : "clamp(26px, 5vw, 34px)";
  $("feedback").textContent = "";
  $("feedback").className = "feedback";
  $("speakBtn").style.display = askKatakana ? "block" : "none";

  const others = shuffle(WORDS.filter(x => x.k !== q.w.k && x.z !== q.w.z)).slice(0, 3);
  const opts = shuffle([q.w, ...others]);
  $("options").innerHTML = opts.map((o, i) => {
    const text = askKatakana ? o.z : o.k;
    return `<button class="opt" data-k="${o.k}"><span class="num">${i + 1}</span>${text}</button>`;
  }).join("");
}

$("options").addEventListener("click", e => {
  const btn = e.target.closest(".opt");
  if (btn) answer(btn.dataset.k);
});

function answer(chosenKatakana) {
  if (state.locked) return;
  state.locked = true;
  const q = state.queue[state.index];
  const isRight = chosenKatakana === q.w.k;
  const needKatakana = q.dir === "z2k";

  document.querySelectorAll(".opt").forEach(b => {
    b.classList.add("locked");
    const thisK = b.dataset.k;
    if (thisK === q.w.k) b.classList.add("correct");
    if (!isRight && thisK === chosenKatakana) b.classList.add("wrong");
  });

  if (isRight) {
    state.correct++;
    $("feedback").textContent = "⭕ 答對了！";
    $("feedback").className = "feedback ok";
  } else {
    state.wrong.push(q.w);
    const rightText = needKatakana ? q.w.k : q.w.z;
    $("feedback").textContent = `❌ 正確答案：${rightText}`;
    $("feedback").className = "feedback no";
  }
  $("okNo").textContent = state.correct;
  $("barFill").style.width = ((state.index + 1) / state.queue.length * 100) + "%";

  setTimeout(() => {
    state.index++;
    if (state.index >= state.queue.length) showResult();
    else renderQuestion();
  }, 1000);
}

function showResult() {
  $("finalScore").textContent = state.correct;
  $("finalTotal").textContent = state.queue.length;
  const pct = state.correct / state.queue.length;
  $("grade").textContent =
    pct === 1 ? "太厲害了！全部答對 🎉" :
    pct >= 0.8 ? "很不錯，再複習一下就完美了！" :
    pct >= 0.5 ? "有進步空間，再接再厲！" :
    "別灰心，多看幾次就記住了 💪";

  if (state.wrong.length) {
    $("review").innerHTML =
      `<h3>要複習的單字（${state.wrong.length}）</h3>` +
      state.wrong.map(w =>
        `<div class="review-item"><b>${w.k}</b><span>${w.z}</span></div>`).join("");
  } else {
    $("review").innerHTML = "";
  }
  show("result");
}

/* ---------- 畫面切換 ---------- */
function show(name) {
  document.body.dataset.screen = name;
  ["start", "quiz", "result"].forEach(n =>
    $("screen-" + n).classList.toggle("hidden", n !== name));
  window.scrollTo({ top: 0, behavior: "smooth" });
}

$("startBtn").addEventListener("click", startRound);
$("againBtn").addEventListener("click", startRound);
$("backBtn").addEventListener("click", () => show("start"));

/* ---------- 發音 ---------- */
$("speakBtn").addEventListener("click", () => {
  const w = state.queue[state.index]?.w;
  if (!w || !window.speechSynthesis || !JPQ.sfx.on) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(w.k);
  u.lang = "ja-JP";
  u.rate = 0.9;
  speechSynthesis.speak(u);
});

window.addEventListener("pagehide", () => window.speechSynthesis?.cancel());
document.addEventListener("visibilitychange", () => { if (document.hidden) window.speechSynthesis?.cancel(); });

/* ---------- 鍵盤 1–4 ---------- */
document.addEventListener("keydown", e => {
  if (e.repeat || e.isComposing || e.ctrlKey || e.altKey || e.metaKey || e.target.closest?.("input,textarea,select,[contenteditable=true]")) return;
  if (!$("modal").classList.contains("hidden")) return;
  if ($("screen-quiz").classList.contains("hidden")) return;
  const n = Number(e.key);
  if (n >= 1 && n <= 4) {
    const btn = document.querySelectorAll(".opt")[n - 1];
    if (btn) btn.click();
  }
});
</script>
