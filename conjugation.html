<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>動詞變化練習 · 遊戲學日語</title>
<meta name="description" content="適合大家的日本語初級Ⅰ、Ⅱ的動詞變化練習。一次選一種變化，每次6題，附簡單中文說明。">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/home.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%F0%9F%A7%A9%3C/text%3E%3C/svg%3E">
</head>
<body>

<div id="site-header"></div>

<main>
  <section id="view-home" class="view">
    <div class="petal-field" aria-hidden="true">
      <i style="--x:8%;--d:19s;--delay:0s;--drift:70px;--sc:.9"></i>
      <i style="--x:24%;--d:23s;--delay:3.4s;--drift:-60px;--sc:.7"></i>
      <i style="--x:39%;--d:16s;--delay:7.1s;--drift:85px;--sc:.95"></i>
      <i style="--x:56%;--d:21s;--delay:1.8s;--drift:-75px;--sc:.65"></i>
      <i style="--x:72%;--d:18s;--delay:9.2s;--drift:65px;--sc:.85"></i>
      <i style="--x:89%;--d:24s;--delay:5.5s;--drift:-55px;--sc:.7"></i>
    </div>

    <div class="portal-hero">
      <div class="sky-decor" aria-hidden="true">
        <span class="cloud cl-a"></span>
        <span class="cloud cl-b"></span>
        <span class="cloud cl-c"></span>
        <span class="cloud cl-d"></span>
        <span class="sun-glow"></span>
      </div>

      <div class="portal-head">
        <div class="wrap">
          <a class="back-site" href="index.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg>
            回遊戲總覽
          </a>
          <p class="eyebrow">大家的日本語 · 初級Ⅰ／Ⅱ</p>
          <h1>動詞變化練習</h1>
          <p class="portal-lede">先從熟悉的「ます形」開始，一次練一種變化。<br>
            每次 6 題，選出答案後就能看簡單說明。</p>
          <div class="hero-stats" id="heroStats"></div>
        </div>
      </div>
    </div>

    <div class="wrap">
      <h2 class="section-title">今天想練哪一種？</h2>
      <p class="section-note">不用按順序闖關。選你正在學的內容就可以開始。</p>
      <div id="verbTopics"></div>

      <details class="vb-reference">
        <summary>忘記怎麼變？看簡單對照表</summary>
        <p class="section-note">先選一種變化，再看第Ⅰ、Ⅱ、Ⅲ類的例子。</p>
        <div id="verbSheet"></div>
      </details>

    </div>
  </section>

  <section id="view-game" class="view hidden">
    <div class="wrap">
      <div class="hud">
        <button class="icon-btn back" id="hudBack" type="button" title="回動詞變化練習">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg>
        </button>
        <div class="hud-title">
          <strong id="hudTitle">遊戲</strong>
          <span id="hudSub"></span>
        </div>
        <div class="hud-bar"><i id="hudFill"></i></div>
        <div class="hud-right" id="hudRight"></div>
      </div>
      <div id="stage"></div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<div class="modal hidden" id="modal">
  <div class="modal-box" role="dialog" aria-modal="true">
    <h3 id="modalTitle"></h3>
    <div id="modalBody"></div>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>

<canvas id="fx" aria-hidden="true"></canvas>

  <script src="js/core.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/learn.js"></script>
  <script src="js/site.js"></script>
  <script src="js/verb-data.js"></script>
  <script src="js/verb-beginner.js"></script>
  <script src="js/verb-levels.js"></script>
  <script src="js/verb-quiz.js"></script>
  <script src="js/verb-sheet.js"></script>
  <script src="js/leaderboard.js"></script>
  <script src="js/home.js"></script>
  <script src="js/verb-boot.js"></script>
</body>
</html>
