# Fly.io 部署設定（選用）
# 用法：fly launch --no-deploy 然後 fly deploy
#
# 排行榜要保存請另外掛一個 volume：
#   fly volumes create nihongo_data --size 1
#   在 fly.toml 加上掛載設定（取消下面 volumes 的註解）

app = "nihongo-2"
primary_region = "nrt"

[build]
  node_version = "20"

[env]
  NODE_ENV = "production"
  DATA_DIR = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  # 讓平台知道怎麼檢查服務活著
  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/api/health"

# [[mounts]]
#   source = "nihongo_data"
#   destination = "/data"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1