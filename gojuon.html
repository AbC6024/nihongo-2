<body>

<div class="petal-field" aria-hidden="true">
  <i style="--x:12%;--d:20s;--delay:1s;--drift:70px;--sc:.85"></i>
  <i style="--x:34%;--d:17s;--delay:5.2s;--drift:-60px;--sc:.7"></i>
  <i style="--x:58%;--d:23s;--delay:2.4s;--drift:80px;--sc:.95"></i>
  <i style="--x:79%;--d:19s;--delay:8.1s;--drift:-70px;--sc:.6"></i>
</div>

<div id="site-header"></div>

<main>
  <section id="view-home" class="view">
    <div class="portal-hero">
      <div class="sky-decor" aria-hidden="true">
        <span class="cloud cl-a"></span>
        <span class="cloud cl-b"></span>
        <span class="cloud cl-c"></span>
        <span class="cloud cl-d"></span>
        <span class="sun-glow"></span>
      </div>

      <div class="portal-head">
        <div class="wrap">
          <a class="back-site" href="index.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg>
            回遊戲總覽
          </a>
          <p class="eyebrow">Kana Quest</p>
          <h1>五十音圖</h1>
          <p class="portal-lede">日語的假名只有幾十個，記熟之後看單字會順很多。<br>先玩四種練習，每一款都能切換平假名、片假名或 N5 單字。</p>
        </div>
      </div>
    </div>

    <div class="wrap">
      <h2 class="section-title">選擇一款玩法 <small>Pick a game</small></h2>
      <p class="section-note">每款玩法都能切換字集（平假名／片假名／單字）與題數，鍵盤按 1 ~ 4 可以快速作答。切換設定會重新開始。</p>
      <div class="game-bars" id="gameGrid"></div>

      <h2 class="section-title">五十音表 <small>Gojuon chart</small></h2>
      <p class="section-note">點任何一個假名都可以聽它怎麼念。五十音是日語假名的基本排列，先記順序再記形狀會快很多。</p>
      <div id="kanaTable"></div>

      <h2 class="section-title">排行榜 <small>Leaderboard</small></h2>
      <h3 class="lb-sub">我的最佳成績</h3>
      <p class="section-note">玩到滿意就可以按「🏆 登記」把成績放進排行榜。</p>
      <div data-mybest="kana-read,kana-write,kana-listen,kana-match"></div>

      <div class="panel" style="margin-top:26px">
        <h3 class="lb-sub">全站排行榜</h3>
        <div data-leaderboard="kana-read"></div>
      </div>
    </div>
  </section>

  <section id="view-game" class="view hidden">
    <div class="wrap">
      <div class="hud">
        <button class="icon-btn back" id="hudBack" type="button" title="回五十音圖">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg>
        </button>
        <div class="hud-title">
          <strong id="hudTitle">遊戲</strong>
          <span id="hudSub"></span>
        </div>
        <div class="hud-bar"><i id="hudFill"></i></div>
        <div class="hud-right" id="hudRight"></div>
      </div>
      <div id="stage"></div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<div class="modal hidden" id="modal">
  <div class="modal-box" role="dialog" aria-modal="true">
    <h3 id="modalTitle"></h3>
    <div id="modalBody"></div>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>

<canvas id="fx" aria-hidden="true"></canvas>

  <script src="js/core.js?v=93d33e43efa2"></script>
  <script src="js/catalog.js?v=71cb93394ead"></script>
  <script src="js/learn.js?v=24e36fefc2b1"></script>
  <script src="js/site.js?v=c0c26ec6ab4d"></script>
<script src="js/kana-data.js?v=0509e2e23415"></script>
<script src="js/vocab-data.js?v=b2d8cb686ded"></script>
<script src="js/gojuon.js?v=09ed699795bd"></script>
<script src="js/leaderboard.js?v=d6025b244299"></script>
<script src="js/home.js?v=dfdc4c80cdfc"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  JPQ.store.load();
  JPQ.site.mountChrome('gojuon');
  JPQ.site.wireTools();
  JPQ.hud.init();
  JPQ.fx.boot();
  JPQ.home.render();
  JPQ.lb.init();

  addEventListener('hashchange', function () {
    JPQ.modal.close();
    JPQ.home.render();
    JPQ.router();
  });

  if (!location.hash || location.hash === '#' || location.hash === '#/') {
    if (location.hash !== '#/') location.hash = '#/'; else JPQ.router();
  } else {
    JPQ.router();
  }
});
</script>
</body>
</html>
