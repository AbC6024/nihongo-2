# Render 免費方案部署設定
# 使用方式：把整個資料夾推到 GitHub，然後在 Render 後台選 "New +" → "Blueprint"
#           指向這個儲存庫，Render 會自動讀取本檔。
#
# 排行榜永久保存：設定 UPSTASH_REDIS_REST_URL 與 UPSTASH_REDIS_REST_TOKEN 兩個環境變數。
# 這裡先留空，請在 Render 後台（Service → Environment）填入你自己的值，
# 這樣不需要付費，成績重啟也不會消失。
#
#   1. 到 https://console.upstash.com 建立免費 Redis 資料庫
#   2. 在 Database 頁面找到 REST API 的 URL 與 Token
#   3. 貼到 Render 的 Environment，存檔後會自動重新部署
#
# 沒有設定的話，成績會存在容器本機的 data/ 資料夾，重啟後清空。
services:
  # 永不休眠的免費靜態前端：Googlebot 會直接讀到網站自己的 robots.txt。
  - type: web
    name: nihongo-2-static
    runtime: static
    buildCommand: npm run build:static
    staticPublishPath: ./dist
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /listening/sw.js
        name: Cache-Control
        value: no-cache, max-age=0, must-revalidate

  # 原本的免費 Web Service 只負責排行榜 API；休眠不影響頁面與 Google 收錄。
  - type: web
    name: nihongo-2
    runtime: node
    plan: free
    region: singapore
    buildCommand: ""
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      # 填入後排行榜就會永久保存（免費額度 500K 指令/月）
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
