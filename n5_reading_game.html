    tr: "沿著這條路直走，就會到車站。車站附近有便利商店。",

  },
  {

    o: ["ともだちの たんじょうびですから", "テストが ありますから", "パーティーが ありますから", "あたらしい くつが ほしいですから"], a: 0,
    tr: "明天是朋友的生日。我在百貨公司買了禮物。",
    why: "「あしたは ともだちの たんじょうびです」＝明天是朋友生日，所以買禮物。"

const ROUND_SIZE = 10;

const $ = id => document.getElementById(id);
const shuffle = a => {
  const r = a.slice();
  for (let i = r.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [r[i], r[j]] = [r[j], r[i]];
  }
  return r;
};
/* 把片假名標色（先跳脫 HTML 再處理） */
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const markKata = s => esc(s).replace(/[\u30A0-\u30FF\u30FC]+/g, m => `<span class="kata">${m}</span>`);

let state = { queue: [], index: 0, correct: 0, wrong: [], locked: false, peeked: false };

/* ---------- 開始 ---------- */
function startRound() {
  state.queue = shuffle(QUIZ).slice(0, ROUND_SIZE);
  state.index = 0;
  state.correct = 0;
  state.wrong = [];
  $("qTotal").textContent = state.queue.length;
  show("quiz");
  renderQuestion();
}

/* ---------- 出題 ---------- */
function renderQuestion() {
  state.locked = false;
  state.peeked = false;
  const q = state.queue[state.index];

  $("qNo").textContent = state.index + 1;
  $("okNo").textContent = state.correct;
  $("barFill").style.width = (state.index / state.queue.length * 100) + "%";

  $("passage").innerHTML = markKata(q.p);
  $("trans").innerHTML = q.tr;
  $("trans").classList.remove("show");
  $("peekBtn").textContent = "顯示中文翻譯";

  $("question").innerHTML = markKata(q.q);

  const order = shuffle(q.o.map((text, i) => ({ text, i })));
  $("options").innerHTML = order.map((o, n) =>
    `<button class="opt" data-i="${o.i}"><span class="num">${n + 1}</span>${markKata(o.text)}</button>`
  ).join("");

  $("feedback").className = "feedback";
  $("feedback").classList.remove("show");
}

/* ---------- 作答 ---------- */
$("options").addEventListener("click", e => {
  const btn = e.target.closest(".opt");
  if (btn) answer(Number(btn.dataset.i));
});

function answer(chosen) {
  if (state.locked) return;
  state.locked = true;
  const q = state.queue[state.index];
  const isRight = chosen === q.a;

  document.querySelectorAll(".opt").forEach(b => {
    b.classList.add("locked");
    const i = Number(b.dataset.i);
    if (i === q.a) b.classList.add("correct");
    if (!isRight && i === chosen) b.classList.add("wrong");
  });

  if (isRight) {
    state.correct++;
    $("fbHead").textContent = "⭕ 答對了！";
    $("feedback").className = "feedback ok show";
  } else {
    state.wrong.push(q);
    $("fbHead").textContent = "❌ 答錯了，正確答案是：" + q.o[q.a];
    $("feedback").className = "feedback no show";
  }

  $("fbBody").innerHTML =
    `<div class="fb-row"><b>中文翻譯：</b>${q.tr}</div>` +
    `<div class="fb-row"><b>解說：</b>${q.why}</div>`;

  $("okNo").textContent = state.correct;
  $("barFill").style.width = ((state.index + 1) / state.queue.length * 100) + "%";

  if (state.index === state.queue.length - 1) $("nextBtn").textContent = "看結果 →";
  else $("nextBtn").textContent = "下一題 →";
}

$("nextBtn").addEventListener("click", () => {
  if (!state.locked || $("screen-quiz").classList.contains("hidden")) return;
  state.index++;
  if (state.index >= state.queue.length) showResult();
  else renderQuestion();
});

/* ---------- 翻譯提示 ---------- */
$("peekBtn").addEventListener("click", () => {
  const t = $("trans");
  const on = t.classList.toggle("show");
  $("peekBtn").textContent = on ? "隱藏中文翻譯" : "顯示中文翻譯";
});

/* ---------- 結果 ---------- */
function showResult() {
  $("finalScore").textContent = state.correct;
  $("finalTotal").textContent = state.queue.length;
  const pct = state.correct / state.queue.length;
  $("grade").textContent =
    pct === 1 ? "全部正確！N5 閱讀難不倒你 🎉" :
    pct >= 0.8 ? "很不錯！再讀幾篇就更穩了。" :
    pct >= 0.5 ? "有抓到重點，但細節再看一次會更好。" :
    "別急，先看中文翻譯，再回頭讀一次短文吧 💪";

  if (state.wrong.length) {
    $("review").innerHTML =
      `<h3>再看一次（${state.wrong.length} 題）</h3>` +
      state.wrong.map(q =>
        `<div class="review-item">
           <div class="rq">${markKata(q.q)}</div>
           <div class="ra">✓ ${markKata(q.o[q.a])}</div>
         </div>`).join("");
  } else {
    $("review").innerHTML = "";
  }
  show("result");
}

/* ---------- 畫面 ---------- */
function show(name) {
  document.body.dataset.screen = name;
  ["start", "quiz", "result"].forEach(n =>
    $("screen-" + n).classList.toggle("hidden", n !== name));
  window.scrollTo({ top: 0, behavior: "smooth" });
}

$("startBtn").addEventListener("click", startRound);
$("againBtn").addEventListener("click", startRound);

/* ---------- 鍵盤 ---------- */
document.addEventListener("keydown", e => {
  if (e.repeat || e.isComposing || e.ctrlKey || e.altKey || e.metaKey || e.target.closest?.("input,textarea,select,[contenteditable=true]")) return;
  if (!$("modal").classList.contains("hidden")) return;
  if ($("screen-quiz").classList.contains("hidden")) return;
  if (!state.locked) {
    const n = Number(e.key);
    if (n >= 1 && n <= 4) {
      const btn = document.querySelectorAll(".opt")[n - 1];
      if (btn) btn.click();
    }
  } else if (e.key === "Enter") {
    $("nextBtn").click();
  }
});
</script>
</body>
</html>
