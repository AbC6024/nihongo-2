<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>助詞大冒險 · 遊戲學日語</title>
<meta name="description" content="用四種小遊戲學會日語主題助詞 は・が・の・を・に・で・と・も：選擇題闖關、快速搶答、句子重排、助詞配對。">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/home.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%E2%9C%B8%3C/text%3E%3C/svg%3E">
</head>
<body>

<div id="site-header"></div>

<main>
  <section id="view-home" class="view">
    <div class="petal-field" aria-hidden="true">
      <i style="--x:8%;--d:19s;--delay:0s;--drift:70px;--sc:.9"></i>
      <i style="--x:22%;--d:23s;--delay:3.4s;--drift:-60px;--sc:.7"></i>
      <i style="--x:37%;--d:16s;--delay:7.1s;--drift:85px;--sc:.95"></i>
      <i style="--x:55%;--d:21s;--delay:1.8s;--drift:-75px;--sc:.65"></i>
      <i style="--x:71%;--d:18s;--delay:9.2s;--drift:65px;--sc:.85"></i>
      <i style="--x:88%;--d:24s;--delay:5.5s;--drift:-55px;--sc:.7"></i>
    </div>

    <div class="portal-hero">
      <div class="sky-decor" aria-hidden="true">
        <span class="cloud cl-a"></span>
        <span class="cloud cl-b"></span>
        <span class="cloud cl-c"></span>
        <span class="cloud cl-d"></span>
        <span class="sun-glow"></span>
      </div>

      <div class="portal-head">
        <div class="wrap">
          <a class="back-site" href="index.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg>
            回遊戲總覽
          </a>
          <p class="eyebrow">Japanese Particle Quest</p>
          <h1>助詞大冒險</h1>
          <p class="portal-lede">助詞沒有單獨的意思，卻決定了整句話的主語、對象和地點。<br>這裡有四種玩法，選一個開始吧。</p>
          <div class="hero-stats" id="heroStats"></div>
        </div>
      </div>
    </div>

    <div class="wrap">
      <h2 class="section-title">選擇一款玩法 <small>Pick a game</small></h2>
      <div class="game-bars" id="gameGrid"></div>

      <h2 class="section-title">助詞速查表 <small>Cheat sheet</small></h2>
      <p class="section-note">八個主題助詞的用法整理，答錯的時候可以回來看這裡。</p>
      <div class="card-grid" id="particleCards"></div>

      <h2 class="section-title">排行榜 <small>Leaderboard</small></h2>
      <p class="section-note">玩完之後可以在結算視窗按「🏆 登記排行榜」，填一個暱稱就能上榜。同一個暱稱只保留最高分。</p>
      <div class="panel">
        <div data-leaderboard="quiz"></div>
      </div>
    </div>
  </section>

  <section id="view-game" class="view hidden">
    <div class="wrap">
      <div class="hud">
        <button class="icon-btn back" id="hudBack" type="button" title="回助詞大冒險">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg>
        </button>
        <div class="hud-title">
          <strong id="hudTitle">遊戲</strong>
          <span id="hudSub"></span>
        </div>
        <div class="hud-bar"><i id="hudFill"></i></div>
        <div class="hud-right" id="hudRight"></div>
      </div>
      <div id="stage"></div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<div class="modal hidden" id="modal">
  <div class="modal-box" role="dialog" aria-modal="true">
    <h3 id="modalTitle"></h3>
    <div id="modalBody"></div>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>

<canvas id="fx" aria-hidden="true"></canvas>

  <script src="js/core.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/learn.js"></script>
  <script src="js/site.js"></script>
  <script src="js/data.js"></script>
  <script src="js/quiz.js"></script>
<script src="js/speed.js"></script>
<script src="js/scramble.js"></script>
<script src="js/match.js"></script>
<script src="js/leaderboard.js"></script>
<script src="js/home.js"></script>
<script src="js/boot.js"></script>
</body>
</html>
